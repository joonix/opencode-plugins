name: publish

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.2.22
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-metadata.mjs "$RELEASE_TAG"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: make test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          metadata="$(node scripts/release-metadata.mjs "$RELEASE_TAG")"
          echo "$metadata" | jq .
          echo "directory=$(echo "$metadata" | jq -r .directory)" >> "$GITHUB_OUTPUT"
      - name: Create release tarball
        id: pack
        env:
          PACKAGE_DIRECTORY: ${{ steps.release.outputs.directory }}
        run: |
          mkdir release
          npm pack --json --pack-destination release "./$PACKAGE_DIRECTORY" > release/pack.json
          tarball="$(jq -r '.[0].filename' release/pack.json)"
          test -n "$tarball" && test -f "release/$tarball"
          echo "tarball=release/$tarball" >> "$GITHUB_OUTPUT"
          sha512sum "release/$tarball"
      - name: Publish to npm with provenance
        run: npm publish "./${{ steps.pack.outputs.tarball }}" --access public --provenance
